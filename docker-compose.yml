services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./backend/data:/app/data
      - ./backend/app:/app/app
    environment:
      - DATABASE_URL=sqlite:////app/data/app.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "12000:80"
    depends_on:
      - backend
    restart: unless-stopped
