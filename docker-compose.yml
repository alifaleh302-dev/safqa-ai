services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-negotiator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-negotiator}
      POSTGRES_DB: ${POSTGRES_DB:-negotiator}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-negotiator}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      # Defaults to the bundled Postgres; set DATABASE_URL in .env to point at
      # an external database (e.g. Railway) instead.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-negotiator}:${POSTGRES_PASSWORD:-negotiator}@db:5432/${POSTGRES_DB:-negotiator}}
    volumes:
      # Persist the encrypted Telethon sessions and the editable product catalogue.
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "12000:80"
    restart: unless-stopped

volumes:
  pgdata:
